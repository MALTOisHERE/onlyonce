services:
  # Dashboard: CPU, memory, disk, network, and Docker container stats for
  # this VPS. Host-wide infrastructure, not part of the Blink app itself —
  # it would monitor any other service on this same box too, which is why
  # it lives in its own compose stack here rather than in ../../docker-compose.yml.
  # Bound to localhost only; put a reverse proxy (see README.md) in front of
  # it for any remote access, the same way Blink's own compose does for its app port.
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=${BESZEL_APP_URL:-http://localhost:8090}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  # Agent: reports this host's stats to the hub above over a shared Unix
  # socket (both containers run on this same machine, so no network port
  # between them is needed). TOKEN and KEY come from the hub's own "Add
  # System" dialog — see README.md — not something to invent ahead of time.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - HUB_URL=http://localhost:8090
      - TOKEN=${BESZEL_AGENT_TOKEN}
      - KEY=${BESZEL_AGENT_KEY}
